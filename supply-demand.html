<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supply and Demand - HDB Market</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8f9fa;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #1a1a2e;
    }

    .container {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
      padding: 40px 48px 36px;
      max-width: 780px;
      width: 95%;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 8px;
      color: #1a1a2e;
      letter-spacing: -0.3px;
    }

    .subtitle {
      text-align: center;
      font-size: 14px;
      color: #6b7280;
      margin-bottom: 28px;
      font-weight: 400;
    }

    canvas {
      display: block;
      margin: 0 auto;
      cursor: default;
    }

    .controls {
      margin-top: 28px;
      text-align: center;
    }

    .slider-label {
      font-size: 14px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 12px;
    }

    .slider-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-top: 8px;
    }

    .slider-wrapper span {
      font-size: 12px;
      font-weight: 500;
      color: #6b7280;
      min-width: 90px;
    }

    .slider-wrapper span:first-child {
      text-align: right;
    }

    .slider-wrapper span:last-child {
      text-align: left;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 340px;
      height: 6px;
      background: #e5e7eb;
      border-radius: 3px;
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #2563eb;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(37, 99, 235, 0.35);
      transition: box-shadow 0.15s;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      box-shadow: 0 2px 10px rgba(37, 99, 235, 0.5);
    }

    input[type="range"]::-moz-range-thumb {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #2563eb;
      cursor: pointer;
      border: none;
      box-shadow: 0 2px 6px rgba(37, 99, 235, 0.35);
    }

    .eq-info {
      display: flex;
      justify-content: center;
      gap: 40px;
      margin-top: 20px;
    }

    .eq-box {
      background: #f3f4f6;
      border-radius: 10px;
      padding: 12px 24px;
      text-align: center;
      min-width: 170px;
    }

    .eq-box .label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: #6b7280;
      margin-bottom: 4px;
    }

    .eq-box .value {
      font-size: 22px;
      font-weight: 700;
      color: #1a1a2e;
    }

    .eq-box .direction {
      font-size: 12px;
      font-weight: 500;
      margin-top: 2px;
      height: 18px;
    }

    .direction-up { color: #dc2626; }
    .direction-down { color: #16a34a; }
    .direction-neutral { color: #6b7280; }
  </style>
</head>
<body>
  <div class="container">
    <h1>HDB Market: Supply and Demand</h1>
    <p class="subtitle">Shift the supply curve to observe equilibrium changes</p>

    <canvas id="chart" width="660" height="480"></canvas>

    <div class="controls">
      <div class="slider-label">Shift Supply Curve</div>
      <div class="slider-wrapper">
        <span>Decrease Supply</span>
        <input type="range" id="supplyShift" min="-60" max="60" value="0" step="1">
        <span>Increase Supply</span>
      </div>
    </div>

    <div class="eq-info">
      <div class="eq-box">
        <div class="label">Equilibrium Price</div>
        <div class="value" id="eqPrice">$55</div>
        <div class="direction" id="priceDir"></div>
      </div>
      <div class="eq-box">
        <div class="label">Equilibrium Quantity</div>
        <div class="value" id="eqQty">90</div>
        <div class="direction" id="qtyDir"></div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('chart');
    const ctx = canvas.getContext('2d');
    const slider = document.getElementById('supplyShift');
    const eqPriceEl = document.getElementById('eqPrice');
    const eqQtyEl = document.getElementById('eqQty');
    const priceDirEl = document.getElementById('priceDir');
    const qtyDirEl = document.getElementById('qtyDir');

    // --- Graph layout ---
    const margin = { top: 30, right: 50, bottom: 56, left: 72 };
    const W = canvas.width - margin.left - margin.right;
    const H = canvas.height - margin.top - margin.bottom;

    // --- Economic model (linear) ---
    // Inverse Demand: P = 100 - 0.5Q   (downward sloping)
    // Inverse Supply: P = 10 + 0.5(Q - shift)  (upward sloping, shifts horizontally)
    //
    // Equilibrium:
    //   Q_eq = 90 + 0.5 * shift
    //   P_eq = 55 - 0.25 * shift

    const Q_MIN = 0;
    const Q_MAX = 200;
    const P_MIN = 0;
    const P_MAX = 110;

    // Base equilibrium (shift = 0)
    const BASE_Q = 90;
    const BASE_P = 55;

    function demandP(q) { return 100 - 0.5 * q; }
    function supplyP(q, shift) { return 10 + 0.5 * (q - shift); }

    function eqQ(shift) { return 90 + 0.5 * shift; }
    function eqP(shift) { return 55 - 0.25 * shift; }

    // Map data coords to canvas pixel coords
    function xPx(q) { return margin.left + (q - Q_MIN) / (Q_MAX - Q_MIN) * W; }
    function yPx(p) { return margin.top + H - (p - P_MIN) / (P_MAX - P_MIN) * H; }

    // --- Drawing helpers ---
    function drawLine(x1, y1, x2, y2, color, width, dash) {
      ctx.save();
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      if (dash) ctx.setLineDash(dash);
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
      ctx.restore();
    }

    function drawArrowHead(x, y, angle, size, color) {
      ctx.save();
      ctx.fillStyle = color;
      ctx.translate(x, y);
      ctx.rotate(angle);
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(-size, -size * 0.45);
      ctx.lineTo(-size, size * 0.45);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function drawText(text, x, y, opts = {}) {
      ctx.save();
      ctx.fillStyle = opts.color || '#374151';
      ctx.font = (opts.weight || '500') + ' ' + (opts.size || 13) + 'px Inter, sans-serif';
      ctx.textAlign = opts.align || 'center';
      ctx.textBaseline = opts.baseline || 'middle';
      if (opts.rotate) {
        ctx.translate(x, y);
        ctx.rotate(opts.rotate);
        ctx.fillText(text, 0, 0);
      } else {
        ctx.fillText(text, x, y);
      }
      ctx.restore();
    }

    // --- Main draw ---
    function draw() {
      const shift = parseFloat(slider.value);
      const qE = eqQ(shift);
      const pE = eqP(shift);

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // --- Axes ---
      const axisColor = '#9ca3af';
      const axisWeight = 1.5;

      // Y-axis
      drawLine(margin.left, margin.top - 8, margin.left, margin.top + H, axisColor, axisWeight);
      drawArrowHead(margin.left, margin.top - 8, -Math.PI / 2, 8, axisColor);

      // X-axis
      drawLine(margin.left, margin.top + H, margin.left + W + 8, margin.top + H, axisColor, axisWeight);
      drawArrowHead(margin.left + W + 8, margin.top + H, 0, 8, axisColor);

      // Axis labels
      drawText('Price of HDBs ($)', margin.left - 8, margin.top + H / 2, {
        size: 14, weight: '600', color: '#374151',
        rotate: -Math.PI / 2
      });
      drawText('Quantity of HDBs', margin.left + W / 2, margin.top + H + 44, {
        size: 14, weight: '600', color: '#374151'
      });

      // --- Tick marks on axes ---
      const priceTicks = [0, 20, 40, 60, 80, 100];
      const qtyTicks = [0, 40, 80, 120, 160, 200];

      priceTicks.forEach(p => {
        const y = yPx(p);
        if (p > 0) {
          drawLine(margin.left - 4, y, margin.left, y, '#9ca3af', 1);
          drawText('$' + p, margin.left - 10, y, {
            size: 11, weight: '400', color: '#6b7280', align: 'right'
          });
        }
      });

      qtyTicks.forEach(q => {
        const x = xPx(q);
        if (q > 0) {
          drawLine(x, margin.top + H, x, margin.top + H + 4, '#9ca3af', 1);
          drawText(q.toString(), x, margin.top + H + 16, {
            size: 11, weight: '400', color: '#6b7280'
          });
        }
      });

      // Origin label
      drawText('0', margin.left - 10, margin.top + H + 16, {
        size: 11, weight: '400', color: '#6b7280', align: 'right'
      });

      // --- Demand curve (fixed) ---
      // P = 100 - 0.5Q  →  at Q=0, P=100; at P=0, Q=200
      const dQ1 = 0, dP1 = demandP(0);   // (0, 100)
      const dQ2 = 200, dP2 = demandP(200); // (200, 0)

      ctx.save();
      ctx.strokeStyle = '#dc2626';
      ctx.lineWidth = 2.8;
      ctx.beginPath();
      ctx.moveTo(xPx(dQ1), yPx(dP1));
      ctx.lineTo(xPx(dQ2), yPx(dP2));
      ctx.stroke();
      ctx.restore();

      // Demand label at upper end
      drawText('Demand of HDBs', xPx(20) + 8, yPx(demandP(20)) - 14, {
        size: 13, weight: '600', color: '#dc2626', align: 'left'
      });

      // --- Original supply curve (ghost if shifted) ---
      if (shift !== 0) {
        // P = 10 + 0.5*Q  →  at Q=0, P=10; at P=100, Q=180
        const sQ1_base = Math.max(0, -20);  // Q where P=0 → Q = -20 (clip to 0)
        const sP1_base = supplyP(Math.max(0, -20), 0);
        const sQ2_base = 180;  // P = 10 + 90 = 100
        const sP2_base = supplyP(180, 0);

        ctx.save();
        ctx.strokeStyle = 'rgba(37, 99, 235, 0.2)';
        ctx.lineWidth = 2;
        ctx.setLineDash([6, 4]);
        ctx.beginPath();
        ctx.moveTo(xPx(sQ1_base), yPx(Math.max(0, sP1_base)));
        ctx.lineTo(xPx(sQ2_base), yPx(Math.min(P_MAX, sP2_base)));
        ctx.stroke();
        ctx.restore();

        // Ghost label
        drawText('S\u2080', xPx(sQ2_base) + 6, yPx(sP2_base) - 4, {
          size: 12, weight: '500', color: 'rgba(37, 99, 235, 0.35)', align: 'left'
        });
      }

      // --- Current supply curve ---
      // P = 10 + 0.5*(Q - shift)
      // At P=0: Q = shift - 20  (may be negative, clip)
      // At P=100: Q = shift + 180
      const sQStart = Math.max(0, shift - 20);
      const sPStart = supplyP(sQStart, shift);
      const sQEnd = Math.min(Q_MAX, shift + 180);
      const sPEnd = supplyP(sQEnd, shift);

      ctx.save();
      ctx.strokeStyle = '#2563eb';
      ctx.lineWidth = 2.8;
      ctx.beginPath();
      ctx.moveTo(xPx(sQStart), yPx(Math.max(0, sPStart)));
      ctx.lineTo(xPx(sQEnd), yPx(Math.min(P_MAX, sPEnd)));
      ctx.stroke();
      ctx.restore();

      // Supply label at upper end
      const labelQ = Math.min(sQEnd, shift + 160);
      const labelP = supplyP(labelQ, shift);
      drawText('Supply of HDBs', xPx(labelQ) + 8, yPx(labelP) + 14, {
        size: 13, weight: '600', color: '#2563eb', align: 'left'
      });

      // Subscript for shifted supply
      if (shift !== 0) {
        const subscript = shift > 0 ? 'S\u2081' : 'S\u2081';
        drawText(subscript, xPx(labelQ) + 8, yPx(labelP) + 30, {
          size: 11, weight: '500', color: 'rgba(37, 99, 235, 0.6)', align: 'left'
        });
      }

      // --- Shift arrow on supply curve ---
      if (shift !== 0) {
        const arrowP = 45;
        const baseQAtArrowP = (arrowP - 10) / 0.5;       // Q on base supply at this P
        const shiftedQAtArrowP = (arrowP - 10) / 0.5 + shift; // Q on shifted supply at this P

        const arrowStartX = xPx(baseQAtArrowP);
        const arrowEndX = xPx(shiftedQAtArrowP);
        const arrowY = yPx(arrowP);

        // Only draw if both points are in visible range
        if (baseQAtArrowP >= 0 && baseQAtArrowP <= Q_MAX &&
            shiftedQAtArrowP >= 0 && shiftedQAtArrowP <= Q_MAX) {

          ctx.save();
          ctx.strokeStyle = '#7c3aed';
          ctx.lineWidth = 2;
          ctx.setLineDash([4, 3]);
          ctx.beginPath();
          ctx.moveTo(arrowStartX, arrowY);
          ctx.lineTo(arrowEndX, arrowY);
          ctx.stroke();
          ctx.restore();

          const angle = shift > 0 ? 0 : Math.PI;
          drawArrowHead(arrowEndX, arrowY, angle, 8, '#7c3aed');
        }
      }

      // --- Equilibrium point & dashed lines ---
      const eqXPx = xPx(qE);
      const eqYPx = yPx(pE);

      // Dashed line to Y-axis
      drawLine(margin.left, eqYPx, eqXPx, eqYPx, '#6b7280', 1.2, [5, 4]);
      // Dashed line to X-axis
      drawLine(eqXPx, eqYPx, eqXPx, margin.top + H, '#6b7280', 1.2, [5, 4]);

      // Base equilibrium dashed lines (ghost) if shifted
      if (shift !== 0) {
        const baseEqXPx = xPx(BASE_Q);
        const baseEqYPx = yPx(BASE_P);

        drawLine(margin.left, baseEqYPx, baseEqXPx, baseEqYPx, '#d1d5db', 1, [3, 3]);
        drawLine(baseEqXPx, baseEqYPx, baseEqXPx, margin.top + H, '#d1d5db', 1, [3, 3]);

        // Ghost equilibrium dot
        ctx.save();
        ctx.fillStyle = 'rgba(107, 114, 128, 0.25)';
        ctx.beginPath();
        ctx.arc(baseEqXPx, baseEqYPx, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // P0 and Q0 labels
        drawText('P\u2080', margin.left - 10, baseEqYPx, {
          size: 11, weight: '600', color: '#d1d5db', align: 'right'
        });
        drawText('Q\u2080', baseEqXPx, margin.top + H + 16, {
          size: 11, weight: '600', color: '#d1d5db'
        });
      }

      // Equilibrium dot
      ctx.save();
      ctx.fillStyle = '#1a1a2e';
      ctx.beginPath();
      ctx.arc(eqXPx, eqYPx, 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(eqXPx, eqYPx, 2.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Equilibrium label
      const eqLabelSuffix = shift !== 0 ? '\u2081' : '';
      drawText('E' + eqLabelSuffix, eqXPx + 12, eqYPx - 12, {
        size: 13, weight: '700', color: '#1a1a2e'
      });

      // P_eq and Q_eq on axes
      const pLabel = shift !== 0 ? 'P\u2081' : 'P*';
      const qLabel = shift !== 0 ? 'Q\u2081' : 'Q*';

      drawText(pLabel, margin.left - 10, eqYPx, {
        size: 12, weight: '600', color: '#1a1a2e', align: 'right'
      });
      drawText(qLabel, eqXPx, margin.top + H + 16, {
        size: 12, weight: '600', color: '#1a1a2e'
      });

      // --- Update info boxes ---
      eqPriceEl.textContent = '$' + pE.toFixed(0);
      eqQtyEl.textContent = qE.toFixed(0);

      if (shift > 0) {
        priceDirEl.textContent = 'Price falls as supply increases';
        priceDirEl.className = 'direction direction-down';
        qtyDirEl.textContent = 'Quantity rises as supply increases';
        qtyDirEl.className = 'direction direction-up';
      } else if (shift < 0) {
        priceDirEl.textContent = 'Price rises as supply decreases';
        priceDirEl.className = 'direction direction-up';
        qtyDirEl.textContent = 'Quantity falls as supply decreases';
        qtyDirEl.className = 'direction direction-down';
      } else {
        priceDirEl.textContent = '';
        priceDirEl.className = 'direction direction-neutral';
        qtyDirEl.textContent = '';
        qtyDirEl.className = 'direction direction-neutral';
      }
    }

    // --- Event listeners ---
    slider.addEventListener('input', draw);

    // Initial draw
    draw();
  </script>
</body>
</html>
